<style>
  @font-face{font-family:Aileron;src:url("https://cdn.jsdelivr.net/gh/laser-dog/odd-enterprises@main/fonts/Aileron-Regular.woff") format("woff");font-weight:400;font-display:swap}
  @font-face{font-family:Aileron;src:url("https://cdn.jsdelivr.net/gh/laser-dog/odd-enterprises@main/fonts/Aileron-SemiBold.woff") format("woff");font-weight:600;font-display:swap}
  @font-face{font-family:Redaction;src:url("https://cdn.jsdelivr.net/gh/laser-dog/odd-enterprises@main/fonts/Redaction-Regular.woff2") format("woff2");font-weight:400;font-style:normal;font-display:swap}
  @font-face{font-family:Redaction;src:url("https://cdn.jsdelivr.net/gh/laser-dog/odd-enterprises@main/fonts/Redaction-Italic.woff2") format("woff2");font-weight:400;font-style:italic;font-display:swap}
  :root { --bg:#f5f4f0; --card:#fff; --ink:#221d1c; --mute:#7a736f; --line:#221d1c26; --accent:#53ff45; --on-accent:#221d1c; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#221d1c; --card:#2b2524; --ink:#fff; --mute:#9b928d; --line:#ffffff2e; }
  }
  * { box-sizing:border-box; border-radius:0; }
  body { margin:0; font:15px/1.5 Aileron,system-ui,sans-serif; background:var(--bg); color:var(--ink); }
  main { max-width:980px; margin:0 auto; padding:48px 16px 64px; }
  header { text-align:center; margin-bottom:40px; }
  .logo { width:56px; height:auto; color:var(--ink); }
  h1 { font:italic 400 44px/1.1 Redaction,Georgia,serif; letter-spacing:-.015em; margin:16px 0 8px; }
  p.sub { color:var(--mute); margin:0; font-size:11px; letter-spacing:.1em; text-transform:uppercase; }
  .grid { display:grid; grid-template-columns:repeat(auto-fill,minmax(260px,1fr)); gap:16px; }
  .tool { display:flex; flex-direction:column; background:var(--card); border:1px solid var(--line); color:inherit; text-decoration:none; transition:.15s; }
  .tool:hover { border-color:var(--ink); transform:translateY(-2px); }
  .tool img { width:100%; aspect-ratio:1; object-fit:cover; display:block; background:#221d1c; }
  .info { padding:14px 16px 16px; display:flex; flex-direction:column; gap:4px; flex:1; }
  .info h2 { margin:0; font:italic 400 24px Redaction,Georgia,serif; }
  .info p { margin:0; color:var(--mute); font-size:14px; }
  .open { margin-top:10px; align-self:flex-start; font:600 11px Aileron,sans-serif; letter-spacing:.1em; text-transform:uppercase; background:var(--accent); color:var(--on-accent); padding:8px 12px; border:1px solid var(--ink); }
  footer { text-align:center; margin-top:56px; color:var(--mute); font-size:10px; letter-spacing:.14em; text-transform:uppercase; }
</style>
</head>
